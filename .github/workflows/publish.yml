name: Publish F-Droid repo

# APKs come from the GitHub releases of each app (scripts/fetch-releases.sh). The schedule picks up new
# releases; it only rebuilds when the list of release APKs differs from the deployed site's releases.txt.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/fetch-releases.sh --list > releases.txt
          cat releases.txt
          site=$(sed -n 's/^repo_url: *//p' config.yml)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && curl -fsSL "${site%/repo}/releases.txt" | cmp -s - releases.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    env:
      FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Restore signing key
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$FDROID_KEYSTORE_B64" ] || [ -z "$FDROID_KEYSTORE_PASS" ]; then
            echo "::error::Set the FDROID_KEYSTORE_B64 and FDROID_KEYSTORE_PASS secrets (see README)."
            exit 1
          fi
          echo "$FDROID_KEYSTORE_B64" | base64 -d > keystore.p12
          chmod 600 keystore.p12 config.yml

      - name: Download release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-releases.sh | tee releases.txt

      # fdroid update indexes every file in repo/ and rejects empty ones.
      - name: Build and sign the index
        run: |
          rm -f repo/.gitkeep
          fdroid update --verbose

      - name: Lint metadata
        run: fdroid lint || true

      - name: Assemble site
        run: |
          fingerprint=$(keytool -list -v -keystore keystore.p12 -storepass "$FDROID_KEYSTORE_PASS" -alias fdroid-repo \
            | sed -nE 's/.*SHA ?256: *//p' | tr -d ':[:space:]')
          repo_url=$(sed -n 's/^repo_url: *//p' config.yml)
          add_url="${repo_url}?fingerprint=${fingerprint}"
          mkdir -p site
          cp -r repo site/repo
          cp releases.txt site/releases.txt
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          for meta in metadata/*.yml; do
            id=$(basename "$meta" .yml)
            name=$(sed -n 's/^Name: *//p' "$meta" | esc); name=${name:-$id}
            summary=$(sed -n 's/^Summary: *//p' "$meta" | esc)
            src=$(sed -n 's/^SourceCode: *//p' "$meta")
            version=$(awk -v id="$id" '$1 == id { print $2; exit }' releases.txt)
            icon=$(ls repo/icons-640/"$id".*.png repo/icons-480/"$id".*.png repo/icons/"$id".*.png 2>/dev/null \
              | sort -V | tail -1 || true)
            echo '<li class="card app">'
            if [ -n "$icon" ]; then echo "<img class=\"app-icon\" src=\"$icon\" alt=\"\">"
            else echo "<div class=\"app-icon\">${name:0:1}</div>"; fi
            echo "<div class=\"app-body\"><h3 class=\"app-title\">$name${version:+ <span class=\"badge\">$version</span>}</h3>"
            [ -z "$summary" ] || echo "<p class=\"app-summary\">$summary</p>"
            echo "<div class=\"app-meta\"><code>$id</code>"
            [ -z "$src" ] || echo "<a href=\"$src\">Source code</a> <a href=\"$src/releases\">Releases</a>"
            echo '</div></div></li>'
          done > apps.html
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          sed -e "s|@ADD_URL@|$add_url|g" -e "s|@REPO_URL@|$repo_url|g" \
              -e "s|@FINGERPRINT@|$fingerprint|g" -e "s|@SOURCE_URL@|$source_url|g" \
              -e '/^@APPS@$/{r apps.html' -e 'd}' \
              site.html > site/index.html
          touch site/.nojekyll
          echo "Repo: $add_url" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
